# Test profile: H2 in-memory, schema tạo từ entity (không dùng Flyway/MySQL thật).
spring.datasource.url=jdbc:h2:mem:ecommerce_checkout;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Tắt job hết hạn nền trong test; test gọi trực tiếp service để kiểm soát thời điểm.
checkout.expiry.enabled=false

spring.flyway.enabled=false

# Không seed admin/category trong test (test tự tạo fixture).
app.seed.admin.email=
app.seed.admin.password=

# Cấu hình giả cho provider thanh toán: test chữ ký, không gọi mạng.
payment.vnpay.tmn-code=TESTTMN
payment.vnpay.hash-secret=test-vnpay-secret
payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.return-url=http://localhost:8080/api/payments/vnpay/return

payment.momo.partner-code=TESTPARTNER
payment.momo.access-key=test-access
payment.momo.secret-key=test-secret
payment.momo.endpoint=http://localhost:9999/momo
payment.momo.return-url=http://localhost:8080/api/payments/momo/return
payment.momo.ipn-url=http://localhost:8080/api/payments/momo/ipn
