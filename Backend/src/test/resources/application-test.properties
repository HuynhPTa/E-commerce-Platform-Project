# Test profile: H2 in-memory, schema tạo từ entity (không dùng Flyway/MySQL thật).
spring.datasource.url=jdbc:h2:mem:ecommerce_checkout;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false

# Không seed admin/category trong test (test tự tạo fixture).
app.seed.admin.email=
app.seed.admin.password=
